name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evalai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      mongodb:
        image: mongo:6
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      - name: Install frontend dependencies
        run: npm ci
      
      - name: Start backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evalai_test
          MONGODB_URL: mongodb://localhost:27017/evalai_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_secret_key
          OPENAI_API_KEY: test_key
        run: |
          python backend/main.py &
          sleep 10
      
      - name: Build frontend
        run: npm run build
      
      - name: Run E2E tests
        run: |
          npm run cypress:run
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      
      - name: Upload E2E videos
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-videos
          path: cypress/videos

  load-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evalai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install k6
      
      - name: Start backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evalai_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_secret_key
          OPENAI_API_KEY: test_key
        run: |
          python backend/main.py &
          sleep 10
      
      - name: Run load tests
        run: k6 run tests/load/api-load-test.js
      
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: load-test-results
          path: results/
