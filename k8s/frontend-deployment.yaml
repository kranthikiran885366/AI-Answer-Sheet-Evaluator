apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-evaluator-frontend
  namespace: ai-evaluator
  labels:
    app: ai-evaluator-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-evaluator-frontend
  template:
    metadata:
      labels:
        app: ai-evaluator-frontend
    spec:
      containers:
      - name: frontend
        image: ai-evaluator-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://ai-evaluator-backend:8000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-evaluator-frontend
  namespace: ai-evaluator
spec:
  selector:
    app: ai-evaluator-frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP
