apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-evaluator-ingress
  namespace: ai-evaluator-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "ai-evaluator-backend-service"
spec:
  tls:
  - hosts:
    - ai-evaluator.com
    - api.ai-evaluator.com
    secretName: ai-evaluator-tls
  rules:
  - host: ai-evaluator.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-evaluator-frontend-service
            port:
              number: 3000
  - host: api.ai-evaluator.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-evaluator-backend-service
            port:
              number: 8000
