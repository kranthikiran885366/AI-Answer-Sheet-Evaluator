apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-evaluator-frontend
  namespace: ai-evaluator-prod
  labels:
    app: ai-evaluator-frontend
    version: v3.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-evaluator-frontend
  template:
    metadata:
      labels:
        app: ai-evaluator-frontend
        version: v3.0.0
    spec:
      containers:
      - name: frontend
        image: ai-evaluator-frontend:v3.0.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.ai-evaluator.com"
        - name: NEXT_PUBLIC_WS_URL
          value: "wss://api.ai-evaluator.com"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-evaluator-frontend-service
  namespace: ai-evaluator-prod
spec:
  selector:
    app: ai-evaluator-frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    name: http
  type: ClusterIP
