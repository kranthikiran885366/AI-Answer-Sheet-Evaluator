apiVersion: v1
kind: Secret
metadata:
  name: ai-evaluator-secrets
  namespace: ai-evaluator-prod
type: Opaque
data:
  # Base64 encoded secrets
  OPENAI_API_KEY: <base64-encoded-key>
  GOOGLE_AI_API_KEY: <base64-encoded-key>
  ANTHROPIC_API_KEY: <base64-encoded-key>
  JWT_SECRET: <base64-encoded-secret>
  POSTGRES_PASSWORD: <base64-encoded-password>
  MONGO_PASSWORD: <base64-encoded-password>
  REDIS_PASSWORD: <base64-encoded-password>
  AWS_ACCESS_KEY_ID: <base64-encoded-key>
  AWS_SECRET_ACCESS_KEY: <base64-encoded-secret>
  S3_BUCKET: <base64-encoded-bucket-name>
  SENTRY_DSN: <base64-encoded-dsn>
  WANDB_API_KEY: <base64-encoded-key>
  KAGGLE_API_KEY: <base64-encoded-key>
  KAGGLE_USERNAME: <base64-encoded-username>
