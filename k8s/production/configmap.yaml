apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-evaluator-config
  namespace: ai-evaluator-prod
data:
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql://postgres:password@postgres-service:5432/ai_evaluator"
  MONGODB_URL: "mongodb://mongodb-service:27017/ai_evaluator"
  REDIS_URL: "redis://redis-service:6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  MLFLOW_TRACKING_URI: "http://mlflow-service:5000"
  PROMETHEUS_URL: "http://prometheus-service:9090"
  GRAFANA_URL: "http://grafana-service:3000"
