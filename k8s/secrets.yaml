apiVersion: v1
kind: Secret
metadata:
  name: ai-evaluator-secrets
  namespace: ai-evaluator
type: Opaque
data:
  openai-api-key: <base64-encoded-openai-api-key>
  jwt-secret: <base64-encoded-jwt-secret>
  database-url: <base64-encoded-database-url>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-evaluator-config
  namespace: ai-evaluator
data:
  s3-bucket: "ai-evaluator-files"
  aws-region: "us-east-1"
