apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-evaluator-redis
  namespace: ai-evaluator
  labels:
    app: ai-evaluator-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-evaluator-redis
  template:
    metadata:
      labels:
        app: ai-evaluator-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - --appendonly
        - "yes"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ai-evaluator-redis
  namespace: ai-evaluator
spec:
  selector:
    app: ai-evaluator-redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: ai-evaluator
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
