apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-evaluator-backend
  namespace: ai-evaluator
  labels:
    app: ai-evaluator-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-evaluator-backend
  template:
    metadata:
      labels:
        app: ai-evaluator-backend
    spec:
      containers:
      - name: backend
        image: ai-evaluator-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-evaluator-secrets
              key: openai-api-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ai-evaluator-secrets
              key: jwt-secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ai-evaluator-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://ai-evaluator-redis:6379"
        - name: AWS_REGION
          value: "us-east-1"
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: ai-evaluator-config
              key: s3-bucket
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-evaluator-backend
  namespace: ai-evaluator
spec:
  selector:
    app: ai-evaluator-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
